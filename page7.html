
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Balloon Wishes | Neelam</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --pink: #ed78a9;
    --dark-pink: #cf5188;
    --text: #765c72;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;

    background:
        radial-gradient(circle at 15% 20%, #ffffff 0, transparent 30%),
        radial-gradient(circle at 85% 70%, #f6c8e7 0, transparent 35%),
        linear-gradient(145deg,#9edcff,#d9edff,#fce5f2);
}

.sky {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

/* BACKGROUND CLOUDS */

.cloud {
    position: absolute;
    width: 180px;
    height: 55px;
    background: rgba(255,255,255,.4);
    border-radius: 100px;
    filter: blur(2px);
    animation: cloudMove 30s linear infinite;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
}

.cloud::before {
    width: 85px;
    height: 85px;
    top: -38px;
    left: 25px;
}

.cloud::after {
    width: 65px;
    height: 65px;
    top: -25px;
    right: 25px;
}

.cloud.one { top: 22%; left: -200px; }
.cloud.two { top: 60%; left: -300px; animation-delay: 12s; }

@keyframes cloudMove {
    to { transform: translateX(130vw); }
}

/* HEADER */

.header {
    position: absolute;
    top: 35px;
    width: 100%;
    text-align: center;
    z-index: 10;
    padding: 0 15px;
}

.label {
    display: inline-block;
    background: rgba(255,255,255,.45);
    border: 1px solid rgba(255,255,255,.7);
    padding: 8px 17px;
    border-radius: 30px;
    color: #c45b91;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    backdrop-filter: blur(10px);
}

h1 {
    font-family: 'Playfair Display',serif;
    font-size: clamp(29px,5vw,48px);
    color: #fff;
    margin-top: 17px;
    text-shadow: 0 4px 20px rgba(115,105,165,.2);
}

.subtitle {
    color: #fff;
    font-size: 13px;
    margin-top: 10px;
    text-shadow: 0 2px 8px rgba(90,100,150,.2);
}

/* BALLOONS */

.balloon {
    position: absolute;
    width: 76px;
    height: 96px;
    border-radius: 50% 50% 45% 45%;
    cursor: pointer;
    z-index: 4;

    box-shadow:
        inset -12px -10px 20px rgba(0,0,0,.1),
        inset 10px 8px 15px rgba(255,255,255,.55),
        0 10px 25px rgba(80,100,140,.15);

    animation: floatUp linear infinite;
    transition: filter .3s;
}

.balloon:hover {
    filter: brightness(1.12);
}

.balloon::before {
    content: "";
    position: absolute;
    width: 12px;
    height: 18px;
    border-radius: 50%;
    background: rgba(255,255,255,.5);
    top: 15px;
    left: 15px;
    transform: rotate(25deg);
}

.balloon::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 90px;
    background: rgba(255,255,255,.75);
    top: 95px;
    left: 50%;
    transform-origin: top;
}

.balloon .knot {
    position: absolute;
    width: 11px;
    height: 10px;
    background: inherit;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
}

@keyframes floatUp {
    0% {
        transform: translateY(115vh) rotate(-7deg);
    }
    50% {
        transform: translateY(0) rotate(7deg);
    }
    100% {
        transform: translateY(-150vh) rotate(-7deg);
    }
}

/* GOLDEN BALLOON */

.golden {
    border: 3px solid #fff3ad;
    box-shadow:
        0 0 15px #fff1a6,
        0 0 40px #ffc84a,
        inset -12px -10px 20px rgba(0,0,0,.1),
        inset 10px 8px 15px rgba(255,255,255,.6);
}

/* PROGRESS CARD */

.progress-card {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    width: min(360px,90%);
    padding: 17px 20px;

    background: rgba(255,255,255,.5);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 20px;

    z-index: 10;
    box-shadow: 0 10px 30px rgba(100,110,160,.12);
}

.progress-info {
    display: flex;
    justify-content: space-between;
    color: #865d7a;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 10px;
}

.track {
    height: 7px;
    background: rgba(255,255,255,.7);
    border-radius: 20px;
    overflow: hidden;
}

.fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg,#f28bb8,#d45b99);
    border-radius: 20px;
    transition: width .5s ease;
}

.hint {
    color: #95758b;
    text-align: center;
    font-size: 10px;
    margin-top: 10px;
}

/* NEXT BUTTON */

#nextBtn {
    display: none;
    position: absolute;
    bottom: 125px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;

    padding: 15px 25px;
    white-space: nowrap;

    border: 1px solid rgba(255,255,255,.7);
    border-radius: 15px;
    background: linear-gradient(110deg,#ed77a6,#d95791);
    color: white;
    font-size: 13px;
    font-weight: 700;

    cursor: pointer;
    box-shadow: 0 8px 25px rgba(210,80,140,.3);
    animation: appear .6s ease;
}

#nextBtn:hover {
    box-shadow: 0 12px 30px rgba(210,80,140,.45);
}

@keyframes appear {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* POPUP */

.popup-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;
    background: rgba(50,40,75,.35);
    backdrop-filter: blur(9px);
}

.popup-overlay.show {
    display: flex;
    animation: appear .3s ease;
}

.popup {
    width: 100%;
    max-width: 400px;
    padding: 35px 25px;

    text-align: center;
    border-radius: 25px;

    background: rgba(255,255,255,.95);
    border: 1px solid white;

    box-shadow: 0 20px 60px rgba(100,70,110,.2);
    animation: popupIn .5s ease;
}

@keyframes popupIn {
    from {
        transform: scale(.8) translateY(20px);
        opacity: 0;
    }
    to {
        transform: scale(1) translateY(0);
        opacity: 1;
    }
}

.popup-icon {
    font-size: 45px;
    margin-bottom: 15px;
}

.popup h2 {
    font-family: 'Playfair Display',serif;
    font-size: 27px;
    color: #ce588c;
}

.popup p {
    color: #856d7c;
    font-size: 14px;
    line-height: 1.8;
    margin-top: 15px;
}

.popup button {
    margin-top: 25px;
    padding: 12px 30px;
    border: none;
    border-radius: 12px;
    background: #e76b9c;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

/* CONFETTI */

.confetti {
    position: fixed;
    top: -30px;
    z-index: 100;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(700deg);
        opacity: 0;
    }
}

/* MOBILE */

@media(max-width:600px) {
    .header {
        top: 30px;
    }

    .balloon {
        width: 57px;
        height: 73px;
    }

    .balloon::after {
        height: 65px;
        top: 72px;
    }

    .progress-card {
        bottom: 18px;
    }

    #nextBtn {
        bottom: 125px;
        font-size: 12px;
    }
}

@media(prefers-reduced-motion:reduce) {
    *,*::before,*::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div class="sky">

    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <header class="header">
        <div class="label">✦ A SKY FULL OF WISHES ✦</div>

        <h1>Balloon Wishes For Neelam 🎈</h1>

        <p class="subtitle">
            Every balloon holds a little reminder of how special you are.
            <br>Tap one and discover your surprise.
        </p>
    </header>

    <div class="progress-card">

        <div class="progress-info">
            <span>Wishes discovered</span>
            <span id="counter">0 / 10</span>
        </div>

        <div class="track">
            <div class="fill" id="progress"></div>
        </div>

        <p class="hint">
            ✨ Find all 10 wishes and discover the golden balloon
        </p>

    </div>

    <button id="nextBtn" onclick="location.href='page8.html'">
        🎂 Continue To Cake Ceremony →
    </button>

</div>

<!-- POPUP -->

<div class="popup-overlay" id="overlay" onclick="closePopup()">

    <div class="popup" onclick="event.stopPropagation()">

        <div class="popup-icon" id="popupIcon">🎁</div>

        <h2 id="popupTitle">A Little Wish</h2>

        <p id="wishText"></p>

        <button onclick="closePopup()">That's Lovely ❤️</button>

    </div>

</div>

<script>

/* WISHES */

const wishes = [
"Your smile can brighten even the darkest day. Keep smiling! ❤️",
"Thank you for being such a wonderful friend. 🌸",
"May happiness always find its way to you. ✨",
"You deserve all the love and success in the world. 🌹",
"Never stop being the amazing person you are. 💖",
"Every little moment can become a beautiful memory. 📸",
"You are one of life's precious gifts. 🎁",
"Keep shining like the brightest star. ⭐",
"May your dreams come true one by one. 🌈",
"Happy Birthday Neelam! May this year bring endless happiness. ❤️"
];

const colors = [
"linear-gradient(135deg,#ff8fab,#e94f83)",
"linear-gradient(135deg,#ffd166,#f49b38)",
"linear-gradient(135deg,#80e6c4,#23b78e)",
"linear-gradient(135deg,#7ed6f5,#3e9fc9)",
"linear-gradient(135deg,#c5a3ff,#9163df)",
"linear-gradient(135deg,#ff9fd2,#e85aab)",
"linear-gradient(135deg,#ffadad,#e66c78)",
"linear-gradient(135deg,#a0c4ff,#588bd8)",
"linear-gradient(135deg,#b5e6a5,#69ae65)",
"linear-gradient(135deg,#ffcc80,#e59c48)"
];

let popped = 0;
let goldenFound = false;
const sky = document.querySelector(".sky");

/* CREATE BALLOON */

function createBalloon(index, isGolden = false) {

    const balloon = document.createElement("div");
    balloon.className = "balloon";

    if(isGolden) {
        balloon.classList.add("golden");
        balloon.style.background =
            "linear-gradient(135deg,#fff3a6,#f4bb32,#d99817)";
    } else {
        balloon.style.background = colors[index % colors.length];
    }

    balloon.style.left = (5 + Math.random() * 88) + "%";
    balloon.style.animationDuration = (14 + Math.random() * 10) + "s";
    balloon.style.animationDelay = (-Math.random() * 20) + "s";

    const knot = document.createElement("div");
    knot.className = "knot";
    balloon.appendChild(knot);

    balloon.addEventListener("click", function() {

        if(this.dataset.popped) return;
        this.dataset.popped = "true";

        this.style.transition = ".25s";
        this.style.transform += " scale(0)";
        this.style.opacity = "0";

        setTimeout(() => this.remove(), 250);

        if(isGolden) {
            goldenFound = true;

            showWish(
                "🏆",
                "The Golden Surprise!",
                "You found the special golden balloon! 🎉<br><br>Some people make life brighter just by being themselves. You are one of them, Neelam. Never forget how special you are. ❤️"
            );

            createConfetti();
            checkComplete();
            return;
        }

        popped++;

        document.getElementById("counter").textContent =
            popped + " / 10";

        document.getElementById("progress").style.width =
            (popped / 10 * 100) + "%";

        showWish("💗","A Little Wish",wishes[index]);

        if(popped >= 10) {
            checkComplete();
        }

    });

    sky.appendChild(balloon);
}

/* GENERATE BALLOONS */

for(let i = 0; i < 10; i++) {
    createBalloon(i);
}

createBalloon(10, true);

/* SHOW WISH */

function showWish(icon,title,message) {

    document.getElementById("popupIcon").textContent = icon;
    document.getElementById("popupTitle").textContent = title;
    document.getElementById("wishText").innerHTML = message;

    document.getElementById("overlay").classList.add("show");

}

/* CLOSE POPUP */

function closePopup() {
    document.getElementById("overlay").classList.remove("show");
}

/* CHECK PROGRESS */

function checkComplete() {

    if(popped >= 10 && goldenFound) {

        document.getElementById("nextBtn").style.display = "block";

        document.querySelector(".hint").textContent =
            "✨ All wishes discovered! Your next surprise awaits.";

    } else if(popped >= 10) {

        document.querySelector(".hint").textContent =
            "🌟 All 10 wishes found! Now find the golden balloon!";

    }

}

/* CONFETTI */

function createConfetti() {

    const symbols = ["💗","✨","🎉","🌸","⭐"];

    for(let i = 0; i < 65; i++) {

        const confetti = document.createElement("div");

        confetti.className = "confetti";
        confetti.textContent =
            symbols[Math.floor(Math.random() * symbols.length)];

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.fontSize = (12 + Math.random() * 20) + "px";
        confetti.style.animationDuration = (3 + Math.random() * 4) + "s";

        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 7500);

    }

}

/* ESCAPE KEY */

document.addEventListener("keydown", function(e) {
    if(e.key === "Escape") closePopup();
});

</script>

</body>
</html>

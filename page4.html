<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Special Letter For Neelam</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

/* GLOBAL */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --pink: #e76b9c;
    --dark-pink: #c94f83;
    --text: #594451;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px 15px;

    font-family: 'DM Sans', sans-serif;

    background:
        radial-gradient(circle at 15% 20%, #ffd2e5, transparent 35%),
        radial-gradient(circle at 85% 80%, #e9d9ff, transparent 35%),
        linear-gradient(135deg,#fff0f6,#fff9fc,#f5efff);
}

/* BACKGROUND GLOW */

.glow {
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .4;
    pointer-events: none;
}

.glow.one {
    background: #ff91bc;
    top: -150px;
    left: -100px;
}

.glow.two {
    background: #c7a4ff;
    bottom: -150px;
    right: -100px;
}

/* FLOATING ELEMENTS */

.float {
    position: fixed;
    bottom: -60px;
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear forwards;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0);
        opacity: 0;
    }

    10% {
        opacity: .8;
    }

    100% {
        transform: translateY(-115vh) rotate(35deg);
        opacity: 0;
    }
}

/* SPARKLES */

.sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 1;
    animation: sparkleFade 2s ease forwards;
}

@keyframes sparkleFade {
    0% {
        opacity: 0;
        transform: scale(.3);
    }

    50% {
        opacity: 1;
        transform: scale(1.2);
    }

    100% {
        opacity: 0;
        transform: scale(.4);
    }
}

/* INTRO SCREEN */

#intro {
    position: relative;
    z-index: 5;

    width: 100%;
    max-width: 650px;

    padding: 60px 35px;

    text-align: center;

    background: rgba(255,255,255,.62);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border: 1px solid rgba(255,255,255,.9);

    border-radius: 32px;

    box-shadow: 0 25px 70px rgba(186,104,147,.15);

    animation: appear 1s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* LABEL */

.label {
    display: inline-block;

    padding: 9px 19px;

    background: #fff0f6;

    color: #d75c91;

    border-radius: 30px;

    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;

    margin-bottom: 30px;
}

/* ENVELOPE */

.envelope {
    font-size: 65px;
    margin-bottom: 20px;

    animation: envelopeFloat 3s ease-in-out infinite;
}

@keyframes envelopeFloat {
    0%,100% {
        transform: translateY(0) rotate(-3deg);
    }

    50% {
        transform: translateY(-12px) rotate(3deg);
    }
}

/* INTRO TITLE */

#title {
    font-family: 'Playfair Display', serif;

    font-size: clamp(27px,6vw,42px);

    color: var(--dark-pink);

    line-height: 1.4;

    min-height: 60px;
}

#introText {
    margin-top: 20px;

    color: #8d7b88;

    font-size: 15px;

    line-height: 1.9;

    min-height: 65px;
}

/* TYPEWRITER */

.typewriter {
    border-right: 2px solid #e76b9c;
    animation: blink .8s infinite;
}

@keyframes blink {
    50% {
        border-color: transparent;
    }
}

.cursor-hide {
    border-right: none;
    animation: none;
}

/* BUTTON */

button {
    border: none;
    outline: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: .3s ease;
}

.openBtn,
.memoryBtn {
    padding: 16px 30px;

    border-radius: 15px;

    background: linear-gradient(110deg,#ed77a6,#d95791);

    color: white;

    font-size: 14px;
    font-weight: 700;

    box-shadow: 0 10px 25px rgba(218,87,145,.25);

    transition: .3s;
}

.openBtn {
    margin-top: 28px;
    display: none;
}

.openBtn:hover,
.memoryBtn:hover {
    transform: translateY(-4px);
    box-shadow: 0 15px 30px rgba(218,87,145,.35);
}

/* LETTER OVERLAY */

#letterPage {
    display: none;

    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 10;

    padding: 25px 15px;

    justify-content: center;
    align-items: center;

    background: rgba(55,35,50,.38);

    backdrop-filter: blur(9px);

    overflow-y: auto;
}

/* LETTER CARD */

.parchment {
    position: relative;

    width: 100%;
    max-width: 850px;

    max-height: 90vh;
    overflow-y: auto;

    padding: 45px 55px;

    border-radius: 20px;

    background:
        linear-gradient(145deg,#fffaf0,#f6ead1,#fff7e8);

    border: 1px solid #e8d3a9;

    box-shadow:
        0 25px 80px rgba(0,0,0,.25),
        inset 0 0 35px rgba(177,133,65,.08);

    animation: letterOpen 1s cubic-bezier(.2,.8,.2,1);
}

@keyframes letterOpen {
    from {
        opacity: 0;
        transform: translateY(50px) scale(.92);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* LETTER DECORATION */

.letter-top {
    text-align: center;

    font-size: 25px;

    margin-bottom: 12px;
}

.letter-line {
    width: 90px;
    height: 2px;

    margin: 15px auto 25px;

    background: #d5a86c;
}

/* LETTER TITLE */

#letterTitle {
    font-family: 'Great Vibes', cursive;

    font-size: clamp(38px,6vw,57px);

    color: #9b6039;

    text-align: center;

    min-height: 70px;
}

/* LETTER CONTENT */

#letterContent {
    white-space: pre-line;

    font-family: 'Playfair Display', serif;

    font-size: 17px;

    line-height: 2;

    color: #65472f;

    min-height: 100px;

    text-align: left;
}

/* SIGNATURE */

.signature {
    margin-top: 30px;

    text-align: right;

    font-family: 'Great Vibes', cursive;

    font-size: 43px;

    color: #9b6039;

    min-height: 55px;
}

/* BOTTOM DECORATION */

.letter-bottom {
    text-align: center;
    margin-top: 15px;
    color: #c18b5d;
    font-size: 20px;
}

/* MEMORY BUTTON */

.memoryBtn {
    display: none;

    margin: 30px auto 5px;

    width: 100%;
    max-width: 300px;

    animation: buttonAppear .8s ease;
}

@keyframes buttonAppear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* SCROLLBAR */

.parchment::-webkit-scrollbar {
    width: 6px;
}

.parchment::-webkit-scrollbar-thumb {
    background: #dbb98e;
    border-radius: 20px;
}

/* MOBILE */

@media(max-width:600px) {

    body {
        padding: 18px 12px;
    }

    #intro {
        padding: 45px 22px;
        border-radius: 25px;
    }

    .envelope {
        font-size: 55px;
    }

    #introText {
        font-size: 13px;
    }

    #letterPage {
        padding: 12px;
    }

    .parchment {
        padding: 32px 22px;
        max-height: 94vh;
        border-radius: 16px;
    }

    #letterContent {
        font-size: 15px;
        line-height: 1.9;
    }

    .signature {
        font-size: 36px;
    }

}

/* REDUCED MOTION */

@media(prefers-reduced-motion:reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}

</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="glow one"></div>
<div class="glow two"></div>

<!-- INTRO -->

<div id="intro">

    <div class="label">
        ✨ SOMETHING FROM THE HEART
    </div>

    <div class="envelope">
        💌
    </div>

    <h1 id="title" class="typewriter"></h1>

    <p id="introText" class="typewriter"></p>

    <button
        class="openBtn"
        id="openBtn"
        onclick="openLetter()">

        📜 Open Your Letter

    </button>

</div>


<!-- LETTER -->

<div id="letterPage">

    <div class="parchment" id="parchment">

        <div class="letter-top">
            🌷 ✨ 🌷
        </div>

        <div class="letter-line"></div>

        <h2 id="letterTitle" class="typewriter"></h2>

        <div class="letter-line"></div>

        <p id="letterContent" class="typewriter"></p>

        <div class="signature typewriter" id="signature"></div>

        <div class="letter-bottom">
            ♡ Made with care ♡
        </div>

        <button
            class="memoryBtn"
            id="memoryBtn"
            onclick="location.href='page5.html'">

            📸 Enter The Memory Wall →

        </button>

    </div>

</div>


<script>

/* TYPEWRITER FUNCTION */

function typeWriter(element, text, speed, callback) {

    let i = 0;

    element.textContent = "";

    element.classList.remove("cursor-hide");

    function typing() {

        if(i < text.length) {

            element.textContent += text.charAt(i);

            i++;

            // Automatically scroll the letter
            if(element.id === "letterContent") {
                const parchment = document.getElementById("parchment");
                parchment.scrollTop = parchment.scrollHeight;
            }

            setTimeout(typing, speed);

        } else {

            element.classList.add("cursor-hide");

            if(callback) callback();

        }

    }

    typing();

}


/* INTRO ANIMATION */

const titleText =
"💌 A Special Letter For Neelam";

const introText =
"Before you explore all the beautiful memories, there's something I want to share with you.";


window.addEventListener("load", function() {

    typeWriter(
        document.getElementById("title"),
        titleText,
        65,
        () => {

            typeWriter(
                document.getElementById("introText"),
                introText,
                35,
                () => {

                    document.getElementById("openBtn").style.display = "inline-block";

                }
            );

        }
    );

});


/* OPEN LETTER */

let letterOpened = false;

function openLetter() {

    if(letterOpened) return;

    letterOpened = true;

    document.getElementById("intro").style.display = "none";

    const letterPage = document.getElementById("letterPage");

    letterPage.style.display = "flex";

    const letterTitle =
    "My Dearest Neelam ❤️";

    const letterText =

`Before you look back at all our memories,
I want you to know something.

You are one of the most beautiful chapters of my life.
Not because of how you look,
but because of how you make people feel around you.

Your smile brings comfort.
Your presence brings peace.
Your kindness leaves an impression that words can never fully describe.

Today is your special day,
and while gifts may fade and time may pass,
some feelings remain unchanged.

Thank you for being yourself.
Thank you for being there.
Thank you for creating memories worth remembering.

No matter how many photos appear in the next section,
none of them can truly capture how special you are.

So before entering the Memory Wall...

Remember this:

❤️ You are appreciated.
❤️ You are valued.
❤️ You are an important part of this story.

Happy Birthday Neelam ❤️`;


    typeWriter(
        document.getElementById("letterTitle"),
        letterTitle,
        65,
        () => {

            typeWriter(
                document.getElementById("letterContent"),
                letterText,
                24,
                () => {

                    typeWriter(
                        document.getElementById("signature"),
                        "— Subhradip",
                        90,
                        () => {

                            document.getElementById("memoryBtn").style.display = "block";

                        }
                    );

                }
            );

        }
    );

}


/* FLOATING ITEMS */

function createFloatingItem(symbol, size, duration) {

    const item = document.createElement("div");

    item.className = "float";

    item.textContent = symbol;

    item.style.left = Math.random() * 100 + "vw";

    item.style.fontSize = size + "px";

    item.style.animationDuration = duration + "s";

    document.body.appendChild(item);

    setTimeout(() => {
        item.remove();
    }, duration * 1000);

}


/* HEARTS */

setInterval(() => {

    createFloatingItem(
        "💖",
        15 + Math.random() * 20,
        6 + Math.random() * 4
    );

}, 850);


/* FLOWERS */

const flowers = ["🌸","🌷","🌹","🌺","💐"];

setInterval(() => {

    const flower = flowers[
        Math.floor(Math.random() * flowers.length)
    ];

    createFloatingItem(
        flower,
        18 + Math.random() * 13,
        7 + Math.random() * 4
    );

}, 1300);


/* SPARKLES */

function createSparkle() {

    const sparkle = document.createElement("div");

    sparkle.className = "sparkle";

    sparkle.textContent = "✨";

    sparkle.style.left = Math.random() * 100 + "vw";

    sparkle.style.top = Math.random() * 100 + "vh";

    sparkle.style.fontSize =
        (12 + Math.random() * 14) + "px";

    document.body.appendChild(sparkle);

    setTimeout(() => {
        sparkle.remove();
    }, 2000);

}

setInterval(createSparkle, 850);

</script>

</body>
</html>

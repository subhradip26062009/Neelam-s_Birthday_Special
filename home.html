<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret Birthday Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --pink: #ec6b9c;
    --dark-pink: #d94e87;
    --text: #594451;
    --muted: #998491;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: 'DM Sans', sans-serif;

    background:
        radial-gradient(circle at 15% 20%, #ffd2e5 0, transparent 35%),
        radial-gradient(circle at 85% 80%, #e9d9ff 0, transparent 35%),
        linear-gradient(135deg, #fff0f6, #fff9fc, #f5efff);
}

/* Background decoration */

.background-glow {
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .4;
    pointer-events: none;
}

.glow-one {
    background: #ff91bc;
    top: -150px;
    left: -100px;
}

.glow-two {
    background: #c7a4ff;
    bottom: -160px;
    right: -100px;
}

/* Main card */

.container {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 420px;
    padding: 38px 32px 35px;
    text-align: center;

    background: rgba(255,255,255,.58);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border: 1px solid rgba(255,255,255,.85);
    border-radius: 30px;

    box-shadow:
        0 25px 70px rgba(186, 104, 147, .14),
        inset 0 1px 0 white;

    animation: appear .9s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(35px) scale(.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Top label */

.top-label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border-radius: 30px;
    background: #fff0f6;
    color: #d75c91;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 24px;
}

/* Photo */

.photo-wrapper {
    position: relative;
    width: 230px;
    height: 230px;
    margin: auto;
}

.photo-wrapper::before {
    content: "";
    position: absolute;
    inset: -9px;
    border: 1px solid #f6b6d0;
    border-radius: 27px;
    transform: rotate(4deg);
}

.cover-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 22px;
    border: 5px solid white;

    box-shadow: 0 12px 35px rgba(214, 103, 151, .22);
    transition: transform .5s ease;
}

.photo-wrapper:hover .cover-photo {
    transform: scale(1.035);
}

/* Text */

.title {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 600;
    color: #c94f83;
    margin-top: 29px;
    line-height: 1.3;
}

.subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 11px;
    line-height: 1.7;
}

/* Password section */

.input-wrapper {
    position: relative;
    margin-top: 28px;
}

input {
    width: 100%;
    padding: 16px 48px 16px 18px;

    border: 1px solid #f2d5e2;
    border-radius: 15px;

    background: rgba(255,255,255,.8);
    outline: none;

    font-size: 14px;
    color: var(--text);
    text-align: center;

    transition: .3s;
}

input::placeholder {
    color: #c2a9b5;
}

input:focus {
    border-color: #e889b2;
    box-shadow: 0 0 0 4px rgba(236,107,156,.10);
}

.toggle-password {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #b78b9e;
    font-size: 17px;
    user-select: none;
}

/* Button */

.unlock-btn {
    width: 100%;
    padding: 16px;
    margin-top: 17px;

    border: none;
    border-radius: 15px;

    background: linear-gradient(110deg, #ed77a6, #d95791);
    color: white;

    font-size: 14px;
    font-weight: 700;
    letter-spacing: .4px;

    cursor: pointer;
    box-shadow: 0 9px 22px rgba(218, 87, 145, .24);

    transition: transform .3s, box-shadow .3s;
}

.unlock-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 13px 28px rgba(218, 87, 145, .32);
}

.unlock-btn:active {
    transform: scale(.98);
}

.unlock-btn:disabled {
    opacity: .75;
    cursor: wait;
}

/* Messages */

#msg {
    min-height: 22px;
    margin-top: 17px;
    font-size: 13px;
    font-weight: 600;
    color: #d95791;
}

#msg.success {
    color: #5b9c78;
}

#msg.error {
    color: #dc5570;
    animation: shake .35s;
}

@keyframes shake {
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-3px); }
}

/* Footer */

.footer {
    margin-top: 22px;
    font-size: 10px;
    letter-spacing: 1px;
    color: #b99eac;
}

/* Floating decorations */

.float {
    position: absolute;
    pointer-events: none;
    z-index: 2;
    animation: floatUp linear forwards;
    user-select: none;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    10% {
        opacity: .85;
    }
    100% {
        transform: translateY(-120vh) rotate(30deg);
        opacity: 0;
    }
}

/* Sparkles */

.sparkle {
    position: absolute;
    pointer-events: none;
    z-index: 1;
    animation: sparkleFade 2s ease forwards;
}

@keyframes sparkleFade {
    0% {
        opacity: 0;
        transform: scale(.3);
    }
    50% {
        opacity: 1;
        transform: scale(1.2);
    }
    100% {
        opacity: 0;
        transform: scale(.5);
    }
}

/* Unlock animation */

.container.unlocked {
    animation: unlockEffect .8s ease forwards;
}

@keyframes unlockEffect {
    50% {
        transform: scale(1.04);
        box-shadow: 0 0 50px rgba(236,107,156,.4);
    }
    100% {
        transform: scale(1);
    }
}

/* Mobile */

@media(max-width:480px) {
    .container {
        padding: 30px 22px;
        border-radius: 25px;
    }

    .photo-wrapper {
        width: 205px;
        height: 205px;
    }

    .title {
        font-size: 26px;
    }

    .subtitle {
        font-size: 12px;
    }
}

@media(max-height:650px) {
    .container {
        padding-top: 20px;
        padding-bottom: 20px;
    }

    .photo-wrapper {
        width: 155px;
        height: 155px;
    }

    .top-label {
        margin-bottom: 15px;
    }

    .title {
        margin-top: 20px;
        font-size: 25px;
    }

    .input-wrapper {
        margin-top: 18px;
    }

    .footer {
        margin-top: 12px;
    }
}
</style>
</head>

<body>

<div class="background-glow glow-one"></div>
<div class="background-glow glow-two"></div>

<!-- Main Card -->

<div class="container" id="mainCard">

    <div class="top-label">
        ✨ PRIVATE EXPERIENCE
    </div>

    <div class="photo-wrapper">
        <img
            src="1000209772 .jpg.jpeg"
            class="cover-photo"
            alt="Special birthday memory">
    </div>

    <h1 class="title">
        🔒 Secret Birthday Portal
    </h1>

    <p class="subtitle">
        A magical surprise awaits someone special...
        <br>
        Are you ready to unlock it?
    </p>

    <!-- Password -->

    <div class="input-wrapper">

        <input
            type="password"
            id="password"
            placeholder="Enter your secret password"
            autocomplete="off"
            onkeydown="if(event.key==='Enter') unlockPortal()">

        <span
            class="toggle-password"
            onclick="togglePassword()"
            id="eye">
            👁
        </span>

    </div>

    <button
        class="unlock-btn"
        id="unlockButton"
        onclick="unlockPortal()">

        Unlock The Magic ❤️

    </button>

    <div id="msg" aria-live="polite"></div>

    <div class="footer">
        MADE WITH LOVE • A SPECIAL SURPRISE
    </div>

</div>

<script>

/* Password visibility */

function togglePassword() {

    const input = document.getElementById("password");
    const eye = document.getElementById("eye");

    if(input.type === "password") {
        input.type = "text";
        eye.innerHTML = "🙈";
    } else {
        input.type = "password";
        eye.innerHTML = "👁";
    }

}

/* Unlock Portal */

let isUnlocking = false;

function unlockPortal() {

    if(isUnlocking) return;

    const pass = document.getElementById("password").value;
    const msg = document.getElementById("msg");
    const button = document.getElementById("unlockButton");
    const card = document.getElementById("mainCard");

    if(pass === "23112009") {

        isUnlocking = true;

        msg.className = "success";
        msg.innerHTML = "✨ Access Granted! Preparing your surprise...";

        button.disabled = true;
        button.innerHTML = "Unlocking... ✨";

        card.classList.add("unlocked");

        setTimeout(() => {
            window.location.href = "page2.html";
        }, 1800);

    } else {

        msg.className = "error";
        msg.innerHTML = "❌ Incorrect password. Try again!";

        document.getElementById("password").value = "";
        document.getElementById("password").focus();

    }

}

/* Floating decorations */

function createFloatingItem(symbol, size, duration) {

    const item = document.createElement("div");

    item.className = "float";
    item.innerHTML = symbol;

    item.style.left = Math.random() * 100 + "vw";
    item.style.bottom = "-60px";
    item.style.fontSize = size + "px";
    item.style.animationDuration = duration + "s";

    document.body.appendChild(item);

    setTimeout(() => {
        item.remove();
    }, duration * 1000);

}

/* Hearts */

setInterval(() => {
    createFloatingItem(
        "❤️",
        18 + Math.random() * 20,
        5 + Math.random() * 5
    );
}, 450);

/* Flowers */

const flowers = ["🌹", "🌸", "🌺", "🌷", "💐"];

setInterval(() => {

    const flower = flowers[
        Math.floor(Math.random() * flowers.length)
    ];

    createFloatingItem(
        flower,
        20 + Math.random() * 15,
        6 + Math.random() * 4
    );

}, 850);

/* Balloons */

setInterval(() => {

    createFloatingItem(
        "🎈",
        30 + Math.random() * 20,
        8 + Math.random() * 5
    );

}, 1200);

/* Sparkles */

function createSparkle() {

    const sparkle = document.createElement("div");

    sparkle.className = "sparkle";
    sparkle.innerHTML = "✨";

    sparkle.style.left = Math.random() * 100 + "vw";
    sparkle.style.top = Math.random() * 100 + "vh";
    sparkle.style.fontSize = (12 + Math.random() * 15) + "px";

    document.body.appendChild(sparkle);

    setTimeout(() => {
        sparkle.remove();
    }, 2000);

}

setInterval(createSparkle, 500);

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Little Memories | Neelam</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --pink: #dc6596;
    --dark: #684b5d;
}

body {
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;

    background:
        radial-gradient(circle at 10% 15%, #ffd4e7, transparent 35%),
        radial-gradient(circle at 90% 80%, #e6d9ff, transparent 35%),
        linear-gradient(135deg, #fff3f8, #fffafd, #f5efff);
}

/* HEADER */

header {
    text-align: center;
    padding: 65px 20px 30px;
    position: relative;
    z-index: 2;
}

.tag {
    display: inline-block;
    padding: 8px 18px;
    border-radius: 30px;
    background: white;
    color: var(--pink);
    font-size: 11px;
    letter-spacing: 2px;
    font-weight: 700;
    margin-bottom: 20px;
}

h1 {
    font-family: 'Playfair Display', serif;
    color: #c94f83;
    font-size: clamp(34px, 6vw, 52px);
}

header p {
    color: #987e8e;
    margin-top: 13px;
    font-size: 14px;
}

/* GALLERY */

.gallery {
    max-width: 1100px;
    margin: 35px auto;
    padding: 20px 25px;

    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 35px;
}

/* POLAROID */

.polaroid {
    width: 225px;
    padding: 11px 11px 17px;

    background: white;
    border-radius: 4px;

    box-shadow: 0 12px 30px rgba(112, 65, 94, .16);

    cursor: pointer;

    transition: transform .4s ease, box-shadow .4s ease;

    animation: appear .8s ease both;
}

.polaroid:nth-child(1) { transform: rotate(-7deg); }
.polaroid:nth-child(2) { transform: rotate(5deg); }
.polaroid:nth-child(3) { transform: rotate(-4deg); }
.polaroid:nth-child(4) { transform: rotate(7deg); }
.polaroid:nth-child(5) { transform: rotate(-6deg); }
.polaroid:nth-child(6) { transform: rotate(4deg); }

.polaroid:hover {
    transform: rotate(0deg) translateY(-12px) scale(1.06);
    box-shadow: 0 22px 45px rgba(112, 65, 94, .25);
    z-index: 3;
}

.polaroid img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
    background: #fce8f1;
}

.caption {
    text-align: center;
    margin-top: 13px;

    font-family: 'Caveat', cursive;
    font-size: 23px;
    color: #755466;
}

/* ENTRANCE */

@keyframes appear {
    from {
        opacity: 0;
        translate: 0 30px;
    }
    to {
        opacity: 1;
        translate: 0 0;
    }
}

/* FOOTER */

.footer {
    text-align: center;
    padding: 20px;
    color: #b18da2;
    font-size: 12px;
    letter-spacing: 2px;
}

/* CONTINUE */

.continue {
    display: block;
    margin: 20px auto 65px;
    padding: 15px 35px;

    border: none;
    border-radius: 15px;

    background: linear-gradient(110deg, #ed77a6, #d95791);
    color: white;

    font-size: 14px;
    font-weight: 700;
    cursor: pointer;

    box-shadow: 0 10px 25px rgba(218, 87, 145, .25);
    transition: .3s;
}

.continue:hover {
    transform: translateY(-4px);
    box-shadow: 0 15px 30px rgba(218, 87, 145, .35);
}

/* PHOTO PREVIEW */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(38, 22, 34, .75);
    backdrop-filter: blur(10px);

    display: none;
    justify-content: center;
    align-items: center;

    padding: 20px;
    z-index: 20;
}

.overlay.active {
    display: flex;
    animation: fade .3s ease;
}

.preview {
    position: relative;
    background: white;
    padding: 15px 15px 25px;
    width: 100%;
    max-width: 390px;
    border-radius: 5px;
    text-align: center;

    animation: zoom .4s ease;
}

.preview img {
    width: 100%;
    max-height: 55vh;
    object-fit: contain;
    background: #f8edf2;
}

.preview h2 {
    font-family: 'Caveat', cursive;
    color: #c94f83;
    font-size: 30px;
    margin-top: 15px;
}

.preview p {
    color: #856c7b;
    line-height: 1.7;
    font-size: 13px;
    margin-top: 8px;
}

.close {
    position: absolute;
    right: -12px;
    top: -14px;

    width: 35px;
    height: 35px;
    border: none;
    border-radius: 50%;

    background: #e76b9c;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

@keyframes fade {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes zoom {
    from {
        opacity: 0;
        transform: scale(.8);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* FLOATING HEARTS */

.float {
    position: fixed;
    bottom: -40px;
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear forwards;
}

@keyframes floatUp {
    to {
        transform: translateY(-110vh) rotate(30deg);
        opacity: 0;
    }
}

/* MOBILE */

@media(max-width:600px) {
    header {
        padding-top: 45px;
    }

    .gallery {
        gap: 25px;
        padding: 15px;
    }

    .polaroid {
        width: min(42vw, 190px);
        padding: 8px 8px 13px;
    }

    .polaroid img {
        height: 175px;
    }

    .caption {
        font-size: 19px;
    }
}

@media(prefers-reduced-motion:reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<header>
    <div class="tag">✦ A COLLECTION OF MOMENTS ✦</div>

    <h1>Little Moments, Big Memories 💗</h1>

    <p>
        Every picture has a story.
        Click one to discover it.
    </p>
</header>

<!-- POLAROID GALLERY -->

<div class="gallery" id="gallery"></div>

<div class="footer">
    MADE WITH LOVE • JUST FOR YOU
</div>

<button class="continue"
onclick="location.href='page6.html'">
    🎂 Continue The Journey →
</button>

<!-- PHOTO PREVIEW -->

<div class="overlay" id="overlay" onclick="closePreview()">

    <div class="preview" onclick="event.stopPropagation()">

        <button class="close" onclick="closePreview()">×</button>

        <img id="previewImg" src="" alt="Memory photo">

        <h2 id="previewTitle"></h2>

        <p id="previewText"></p>

    </div>

</div>

<script>

/* ADD YOUR MEMORIES HERE */

const memories = [

{
photo: "IMG_20260609_195644.jpg.jpeg",
caption: "The Beginning ❤️",
message: "Every beautiful story has a beginning. This one is worth remembering."
},

{
photo: "IMG20260602185824.heif",
caption: "Sweet Moments 🌸",
message: "Some little moments become our favourite memories."
},

{
photo: "IMG20260721134735.heif",
caption: "Pure Happiness ✨",
message: "A beautiful moment captured forever."
},

{
photo: "IMG20260426150139.heif",
caption: "Unforgettable 💗",
message: "A memory that always brings a smile."
},

{
photo: "1000209812 (3).jpg.jpeg",
caption: "Forever Special 🌷",
message: "Some memories are simply too precious to forget."
},

{
photo: "photo6.jpg",
caption: "Your Special Day 🎂",
message: "Today, we celebrate you and all the happiness you bring."
}

];

/* GENERATE POLAROIDS */

const gallery = document.getElementById("gallery");

memories.forEach((memory, index) => {

    const card = document.createElement("div");

    card.className = "polaroid";
    card.style.animationDelay = (index * .15) + "s";

    const img = document.createElement("img");
    img.src = memory.photo;
    img.alt = memory.caption;

    img.onerror = function() {
        this.alt = "Photo not found: " + memory.photo;
    };

    const caption = document.createElement("div");
    caption.className = "caption";
    caption.textContent = memory.caption;

    card.appendChild(img);
    card.appendChild(caption);

    card.addEventListener("click", () => {
        openPreview(memory);
    });

    gallery.appendChild(card);

});

/* OPEN PREVIEW */

function openPreview(memory) {

    document.getElementById("previewImg").src = memory.photo;
    document.getElementById("previewTitle").textContent = memory.caption;
    document.getElementById("previewText").textContent = memory.message;

    document.getElementById("overlay").classList.add("active");

}

/* CLOSE PREVIEW */

function closePreview() {
    document.getElementById("overlay").classList.remove("active");
}

/* ESC KEY */

document.addEventListener("keydown", function(e) {
    if(e.key === "Escape") {
        closePreview();
    }
});

/* FLOATING HEARTS */

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "float";
    heart.textContent = "💗";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 18) + "px";
    heart.style.animationDuration = (7 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 11000);

}

setInterval(createHeart, 900);

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neelu's Birthday ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

iframe {
    width: 100%;
    height: 100dvh;
    border: none;
    display: block;
}

#musicBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 99999;
    background: rgba(255, 192, 203, 0.95);
    color: #702044;
    border: none;
    padding: 12px 18px;
    border-radius: 30px;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 3px 15px #0005;
}
</style>
</head>

<body>

<audio id="bgMusic" src="music.mp3"
       loop preload="auto"></audio>

<button id="musicBtn">🎵 Play Music</button>

<iframe
    id="websiteFrame"
    src="home.html"
    allow="autoplay">
</iframe>

<script>
const music = document.getElementById("bgMusic");
const button = document.getElementById("musicBtn");

button.addEventListener("click", async () => {
    if (music.paused) {
        try {
            await music.play();
            button.textContent = "🎵 Music ON";
        } catch (error) {
            button.textContent = "Tap to Play 🎵";
        }
    } else {
        music.pause();
        button.textContent = "🔇 Music OFF";
    }
});
</script>

</body>
</html>
